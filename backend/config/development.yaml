logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: pretty

server:
  port: 3000
  host: http://localhost
  binding: 0.0.0.0
  expose_request_id: true
  middlewares:
    cors:
      enable: true
      allow_origins: ["*"]
      allow_headers: ["*"]
      allow_methods: ["*"]

database:
  uri: postgres://postgres:postgres@localhost:5433/reservazap
  enable_logging: true
  min_connections: 1
  max_connections: 5
  connect_timeout: 500
  idle_timeout: 500
  auto_migrate: true

workers:
  mode: BackgroundAsync

scheduler:
  output: stdout
  jobs:
    expire_holds:
      run: "expire_holds"
      schedule: "0 */1 * * * *"
      tags: ["maintenance"]