# Stack de produção: postgres + backend + frontend
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Requer no .env: JWT_SECRET (openssl rand -base64 48) e, para integrações
# reais, as credenciais dos providers (Mercado Pago / Evolution API).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: reservazap-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOCO_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-reservazap}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -base64 48)}
      PIX_PROVIDER: ${PIX_PROVIDER:-mock}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NUXT_API_PROXY_TARGET: http://backend:3000
    container_name: reservazap-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_API_BASE_INTERNAL: http://backend:3000/api
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
