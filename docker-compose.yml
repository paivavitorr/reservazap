services:
  postgres:
    image: postgres:16-alpine
    container_name: reservazap-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservazap
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Stack completa: docker compose --profile full up
  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: reservazap-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOCO_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/reservazap
      JWT_SECRET: ${JWT_SECRET:-dev-secret-substitua-em-producao}
      PIX_PROVIDER: ${PIX_PROVIDER:-mock}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NUXT_API_PROXY_TARGET: http://backend:3000
    container_name: reservazap-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_API_BASE_INTERNAL: http://backend:3000/api
    ports:
      - "${FRONTEND_PORT:-3001}:3001"

volumes:
  pgdata:
