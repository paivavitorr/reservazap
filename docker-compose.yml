services:
  postgres:
    image: postgres:16-alpine
    container_name: reservazap-db
    environment:
      POSTGRES_USER: postgres
      # em produção use uma senha forte (POSTGRES_PASSWORD) ou banco externo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: reservazap
    ports:
      # apenas localhost — nunca exponha o banco na rede
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
